[package]
name = "flowplan-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "flowPlan app: main loop, window, lifecycle, orchestration"

[[bin]]
name = "flowplan"
path = "src/main.rs"

[features]
# Forwards to `flowplan-render/shader-hot-reload`. Dev-only; enable via
# `cargo run -p flowplan-app --features shader-hot-reload`.
shader-hot-reload = ["flowplan-render/shader-hot-reload"]

[lints]
workspace = true

[dependencies]
flowplan-assets = { workspace = true }
flowplan-sim = { workspace = true }
flowplan-world = { workspace = true }
flowplan-render = { workspace = true }
# flowplan-core added when app uses core types directly.

wgpu = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
crossbeam-queue = { workspace = true }
parking_lot = { workspace = true }
glam = { workspace = true }

egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
