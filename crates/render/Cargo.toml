[package]
name = "flowplan-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "flowPlan renderer: wgpu pipelines, passes, HUD, camera"

[lints]
workspace = true

[features]
# Enables runtime shader hot-reload in development builds. Off by default. See
# `crates/render/src/hot_reload.rs` for the implementation. Do not enable in shipping
# builds: the feature reads WGSL from `CARGO_MANIFEST_DIR`, which is only meaningful on
# the build machine.
shader-hot-reload = ["dep:notify"]

# Enables Tier-3 hardware tests (visual snapshot harness). Off by default; requires a
# wgpu-capable adapter. See `tests/visual_snapshot.rs` and
# [`TEST_PLAN.md § Test Tiers`](../../TEST_PLAN.md#test-tiers).
hardware-tests = []

[dependencies]
flowplan-assets = { workspace = true }
flowplan-sim = { workspace = true }
# Phase 3.6.3c.5c.2: instance renderer dispatches per-primitive-kind
# draw calls; PrimitiveKind enum lives in world crate.
flowplan-world = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
notify = { version = "6", optional = true }
# flowplan-core added in Phase 2 when render uses its types directly.
# tracing added alongside render instrumentation spans.

[dev-dependencies]
insta = "1.34"
image = "0.25"
pollster = { workspace = true }
# naga is already a transitive dep via wgpu; declared here as a dev-dep
# so tests can offline-parse WGSL sources without a GPU device. Used by
# `cloud_noise_wgsl_parses` test (Phase 3.6.3c.6 / 3.2x B1).
naga = { version = "22.1", default-features = false, features = ["wgsl-in"] }
