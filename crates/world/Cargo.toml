[package]
name = "flowplan-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "flowPlan world rules: terrain, water, sky, weather, wind, time-of-day"

[lints]
workspace = true

[dependencies]
flowplan-core = { workspace = true }
glam = { workspace = true }
libm = { workspace = true }
# Data parallelism for the eager sub-biome-assignment bake (Phase
# 3.6.3c.1c). World-bake time only; never on render or audio hot paths.
rayon = { workspace = true }
# Sub-biome feature libraries (Phase 3.6.2) authored as RON for version-
# control-friendly editing + additions (e.g. HighDesert Book Cliffs
# variant). Parsed once at world-bake time; zero cost on subsequent
# queries. RON + serde are already workspace deps.
ron = { workspace = true }
serde = { workspace = true }
# Compact binary serialization for the bake cache (Phase 3.6.3c.3c.2).
# Used by `bake_cache::save` / `bake_cache::load`. Bake artifacts are
# deterministic per master seed → safe to cache. World-load time only.
bincode = { workspace = true }
# Logging for cache load/save status. World crate uses it only here;
# best-effort messages, never load-bearing.
tracing = { workspace = true }
# world depends on core only. Sim queries world's pure samplers for buoyancy
# (Phase 2.5a) and ground effect (Phase 2.4.6); that's the sim -> world direction.

[dev-dependencies]
# Visual-bench harness writes PNG artifacts for world-gen validation.
# Integration tests only; not linked into the runtime crate.
image = "0.25"
