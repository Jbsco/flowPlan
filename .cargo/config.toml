# Cross-platform determinism discipline for flowPlan.
#
# See CODING_RULES.md § Determinism Discipline for rationale. These flags pin
# the build to IEEE 754-strict floating-point behavior so bit-identical output
# is achievable across Linux / Windows / (future) macOS + Steam Deck.
#
# Any change here should be proposed as a CODING_RULES.md amendment first.

[build]
# No global overrides yet; target-scoped flags below.

# Shared determinism flags applied to every supported target:
#
#   -Ctarget-feature=-fma        — Disable FMA instruction generation on x86
#                                  targets. ARMv8 mandates FMA so this has
#                                  limited effect on aarch64; see fp-contract.
#   -Cllvm-args=-fp-contract=off — Disable LLVM-level `a*b+c` → single-fused-op
#                                  contraction. Critical for aarch64 where FMA
#                                  can't be disabled at the ISA level. Also
#                                  redundant-safe on x86_64.
#
# Both needed together: `-fma` controls ISA-level FMA instruction availability;
# `fp-contract=off` controls whether LLVM's IR optimizer fuses arithmetic
# within a single expression. Without the LLVM flag, aarch64 still fuses.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Ctarget-feature=-fma", "-Cllvm-args=-fp-contract=off"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-Ctarget-feature=-fma", "-Cllvm-args=-fp-contract=off"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=-fma", "-Cllvm-args=-fp-contract=off"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-Ctarget-feature=-fma", "-Cllvm-args=-fp-contract=off"]

[target.x86_64-apple-darwin]
rustflags = ["-Ctarget-feature=-fma", "-Cllvm-args=-fp-contract=off"]

[target.aarch64-apple-darwin]
rustflags = ["-Ctarget-feature=-fma", "-Cllvm-args=-fp-contract=off"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-Ctarget-feature=-fma", "-Cllvm-args=-fp-contract=off"]
