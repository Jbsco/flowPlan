# Cross-platform determinism discipline for flowPlan.
#
# See CODING_RULES.md § Determinism Discipline for rationale. These flags pin
# the build to IEEE 754-strict floating-point behavior so bit-identical output
# is achievable across Linux / Windows / (future) macOS + Steam Deck.
#
# Any change here should be proposed as a CODING_RULES.md amendment first.

[build]
# No global overrides yet; target-scoped flags below.

# Shared determinism flags applied to every supported target:
#
#   -Ctarget-feature=-fma             — Disable FMA instruction generation on
#                                       x86 targets. ARMv8 mandates FMA so
#                                       limited effect on aarch64; covered by
#                                       fp-contract below.
#   -Cllvm-args=-fp-contract=off      — Disable LLVM-level `a*b+c` →
#                                       single-fused-op contraction at IR
#                                       level. Redundant on Rust which already
#                                       defaults to off, but kept for explicit
#                                       documentation.
#   -Cllvm-args=-vectorize-loops=false — Disable LLVM loop-vectorizer. Stops
#                                       scalar loops being turned into SSE on
#                                       x86_64 vs NEON on aarch64 with
#                                       potentially different intermediate
#                                       rounding across architectures.
#   -Cllvm-args=-vectorize-slp=false  — Disable SLP (superword-level
#                                       parallelism) vectorizer. Same rationale
#                                       as loop-vectorize; also covers straight
#                                       basic blocks not inside loops.
#
# Performance cost: auto-vectorization is a real perf win for some code; we
# trade it for cross-platform bit-identity. Sim-tick is small + scalar-heavy
# so the cost should be modest. Monitor the frame-budget bench.

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-Ctarget-feature=-fma",
    "-Cllvm-args=-fp-contract=off",
    "-Cllvm-args=-vectorize-loops=false",
    "-Cllvm-args=-vectorize-slp=false",
]

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-Ctarget-feature=-fma",
    "-Cllvm-args=-fp-contract=off",
    "-Cllvm-args=-vectorize-loops=false",
    "-Cllvm-args=-vectorize-slp=false",
]

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-Ctarget-feature=-fma",
    "-Cllvm-args=-fp-contract=off",
    "-Cllvm-args=-vectorize-loops=false",
    "-Cllvm-args=-vectorize-slp=false",
]

[target.x86_64-pc-windows-gnu]
rustflags = [
    "-Ctarget-feature=-fma",
    "-Cllvm-args=-fp-contract=off",
    "-Cllvm-args=-vectorize-loops=false",
    "-Cllvm-args=-vectorize-slp=false",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-Ctarget-feature=-fma",
    "-Cllvm-args=-fp-contract=off",
    "-Cllvm-args=-vectorize-loops=false",
    "-Cllvm-args=-vectorize-slp=false",
]

[target.aarch64-apple-darwin]
rustflags = [
    "-Ctarget-feature=-fma",
    "-Cllvm-args=-fp-contract=off",
    "-Cllvm-args=-vectorize-loops=false",
    "-Cllvm-args=-vectorize-slp=false",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-Ctarget-feature=-fma",
    "-Cllvm-args=-fp-contract=off",
    "-Cllvm-args=-vectorize-loops=false",
    "-Cllvm-args=-vectorize-slp=false",
]
